    <ellipse cx="624" cy="222" rx="8"    ry="8"    fill="#050D1C"
      style="animation: blink 5.2s ease-in-out 0.8s infinite; transform-origin: 622px 220px"/>
    <circle  cx="626" cy="217" r="2.8" fill="white" opacity="0.95"/>

    <!-- RIGHT EYE -->
    <ellipse cx="676" cy="220" rx="13.5" ry="13.5" fill="#F8FAFC"/>
    <ellipse cx="678" cy="222" rx="8"    ry="8"    fill="#050D1C"
      style="animation: blink 5.2s ease-in-out 0.8s infinite; transform-origin: 676px 220px"/>
    <circle  cx="680" cy="217" r="2.8" fill="white" opacity="0.95"/>

    <!-- BEAK -->
    <path d="M641,270 Q655,263 669,270 L664,284 Q655,289 646,284 Z"
