    <!-- slight smile crease -->
    <path d="M644,285 Q655,290 666,285" fill="none" stroke="#C87028" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

    <!-- HEADPHONES arc -->
    <path d="M580,222 C576,174 734,174 730,222"
