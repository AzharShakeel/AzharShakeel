    <!-- steam 2 -->
    <path d="M552,357 Q559,340 552,326 T555,308" fill="none" stroke="#8BA8C8"
      stroke-width="1.8" stroke-linecap="round" opacity="0"
      style="animation: st2 3.2s ease-out 0.9s infinite"/>
  </g>

  <!-- ── PENGUIN ── -->
