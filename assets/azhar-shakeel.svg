    <!-- BODY -->
    <path d="M599,300 C587,268 723,268 711,300 C728,342 732,413 711,454 C690,474 620,474 599,454 C578,413 582,342 599,300 Z"
      fill="url(#pgB)" stroke="#182E48" stroke-width="1.8"/>

    <!-- body rim light left -->
    <path d="M599,300 C587,268 655,268 655,268"
      fill="none" stroke="#4F8EFF" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>

    <!-- BELLY -->
    <path d="M620,304 C609,276 701,276 690,304 C703,338 705,410 690,448 C678,462 632,462 620,448 C605,410 607,338 620,304 Z"
      fill="url(#pgW)"/>

    <!-- belly shine pulse -->
    <ellipse cx="652" cy="340" rx="22" ry="32" fill="white" opacity="0"
