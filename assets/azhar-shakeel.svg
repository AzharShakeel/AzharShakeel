<!-- ░░ LENS FLARE ░░ -->
<g transform="translate(1110,72)" style="animation: flicker 5.5s ease-in-out infinite">
  <circle cx="0" cy="0" r="32" fill="white" opacity="0.045"/>
  <circle cx="0" cy="0" r="14" fill="#4F8EFF" opacity="0.14"/>
