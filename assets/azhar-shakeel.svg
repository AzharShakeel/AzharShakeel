<svg width="100%" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ASD — System Architect · AI Builder</title>

<defs>
<style>
  @keyframes bob { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-9px)} }
  @keyframes blink { 0%,88%,100%{transform:scaleY(1)} 91%,93%{transform:scaleY(0.06)} }
  @keyframes hpGlow { 0%,100%{filter:drop-shadow(0 0 5px #4F8EFF) drop-shadow(0 0 10px #4F8EFF)} 50%{filter:drop-shadow(0 0 9px #7C3AED) drop-shadow(0 0 18px #7C3AED)} }
  @keyframes st1 { 0%{opacity:0;transform:translateY(0) translateX(0)} 12%{opacity:0.65} 88%{opacity:0.18} 100%{opacity:0;transform:translateY(-32px) translateX(6px)} }
  @keyframes st2 { 0%{opacity:0;transform:translateY(0) translateX(0)} 12%{opacity:0.5} 88%{opacity:0.12} 100%{opacity:0;transform:translateY(-28px) translateX(-5px)} }
  @keyframes scan { 0%{transform:translateY(-2px);opacity:0.55} 100%{transform:translateY(562px);opacity:0} }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes flicker { 0%,100%{opacity:0.18} 50%{opacity:0.34} }
  @keyframes blink2 { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes shine { 0%,100%{opacity:0.1} 50%{opacity:0.28} }
  @keyframes rgbA { 0%{stop-color:#4F8EFF} 33%{stop-color:#7C3AED} 66%{stop-color:#06B6D4} 100%{stop-color:#4F8EFF} }
  @keyframes rgbB { 0%{stop-color:#7C3AED} 33%{stop-color:#06B6D4} 66%{stop-color:#4F8EFF} 100%{stop-color:#7C3AED} }
  @keyframes rgbC { 0%{stop-color:#06B6D4} 33%{stop-color:#4F8EFF} 66%{stop-color:#7C3AED} 100%{stop-color:#06B6D4} }
  @keyframes ambPulse { 0%,100%{opacity:0.2} 50%{opacity:0.38} }
  @keyframes shadowB { 0%,100%{rx:95;opacity:0.22} 50%{rx:78;opacity:0.1} }
</style>

<!-- ── RGB animated gradient ── -->
<linearGradient id="rgb" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%"   stop-color="#4F8EFF"><animate attributeName="stop-color" values="#4F8EFF;#7C3AED;#06B6D4;#4F8EFF" dur="4s" repeatCount="indefinite"/></stop>
  <stop offset="50%"  stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#06B6D4;#4F8EFF;#7C3AED" dur="4s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#4F8EFF;#7C3AED;#06B6D4" dur="4s" repeatCount="indefinite"/></stop>
</linearGradient>

<!-- ── Background ── -->
<radialGradient id="bgR" cx="50%" cy="38%" r="68%">
  <stop offset="0%"   stop-color="#0A1828"/>
  <stop offset="55%"  stop-color="#060C18"/>
  <stop offset="100%" stop-color="#020509"/>
</radialGradient>

<!-- ── Ambient penguin aura ── -->
<radialGradient id="aura" cx="50%" cy="85%" r="55%">
  <stop offset="0%"   stop-color="#4F8EFF" stop-opacity="0.28"/>
  <stop offset="100%" stop-color="#4F8EFF" stop-opacity="0"/>
</radialGradient>

<!-- ── Penguin head ── -->
<radialGradient id="pgH" cx="33%" cy="28%" r="70%">
  <stop offset="0%"   stop-color="#263C58"/>
  <stop offset="52%"  stop-color="#0E1C30"/>
  <stop offset="100%" stop-color="#040B19"/>
</radialGradient>

<!-- ── Penguin body ── -->
<radialGradient id="pgB" cx="30%" cy="24%" r="74%">
  <stop offset="0%"   stop-color="#1C3150"/>
  <stop offset="58%"  stop-color="#0A1626"/>
  <stop offset="100%" stop-color="#030A16"/>
</radialGradient>

<!-- ── Belly / face ── -->
<radialGradient id="pgW" cx="42%" cy="36%" r="60%">
  <stop offset="0%"   stop-color="#FFFFFF"/>
  <stop offset="68%"  stop-color="#EDF2FF"/>
  <stop offset="100%" stop-color="#C8D5E8"/>
</radialGradient>
<radialGradient id="pgF" cx="40%" cy="34%" r="64%">
  <stop offset="0%"   stop-color="#F5F0E7"/>
  <stop offset="72%"  stop-color="#EDE4D5"/>
  <stop offset="100%" stop-color="#D5C9B4"/>
</radialGradient>

<!-- ── Beak ── -->
<linearGradient id="beak" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="#FBBF24"/>
  <stop offset="100%" stop-color="#B45309"/>
</linearGradient>

<!-- ── Feet ── -->
<linearGradient id="feet" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="#F59E0B"/>
  <stop offset="100%" stop-color="#8B4E0A"/>
</linearGradient>

<!-- ── Coffee cup ── -->
<linearGradient id="cupG" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%"   stop-color="#1A2840"/>
  <stop offset="45%"  stop-color="#2A3F5C"/>
  <stop offset="100%" stop-color="#111E30"/>
</linearGradient>
<linearGradient id="lidG" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%"   stop-color="#374151"/>
  <stop offset="100%" stop-color="#0F1825"/>
</linearGradient>

<!-- ── Vignette ── -->
<radialGradient id="vig" cx="50%" cy="50%" r="74%">
  <stop offset="42%"  stop-color="transparent"/>
  <stop offset="100%" stop-color="#010408" stop-opacity="0.82"/>
</radialGradient>

<!-- ── Filters ── -->
<filter id="pgShadow" x="-60%" y="-60%" width="220%" height="220%">
  <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#4F8EFF" flood-opacity="0.22"/>
</filter>
<filter id="g4" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="g8" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="8" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="sb" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="7"/>
</filter>
</defs>

<!-- ░░ BACKGROUND ░░ -->
<rect width="1400" height="560" fill="url(#bgR)"/>

<!-- grid -->
<g stroke="white" stroke-width="1" stroke-opacity="0.016">
  <line x1="0" y1="140" x2="1400" y2="140"/>
  <line x1="0" y1="280" x2="1400" y2="280"/>
  <line x1="0" y1="420" x2="1400" y2="420"/>
  <line x1="350" y1="0" x2="350" y2="560"/>
  <line x1="700" y1="0" x2="700" y2="560"/>
  <line x1="1050" y1="0" x2="1050" y2="560"/>
</g>

<!-- edge accent bars -->
<rect x="0" y="0"   width="1400" height="2.5" fill="url(#rgb)"/>
<rect x="0" y="557" width="1400" height="2.5" fill="url(#rgb)" opacity="0.38"/>

<!-- vol light blobs -->
<g opacity="0.07" filter="url(#sb)">
  <polygon points="620,0 700,400 540,400" fill="url(#rgb)"/>
  <polygon points="860,0 920,400 800,400" fill="url(#rgb)" opacity="0.6"/>
</g>

<!-- scan line (one pass) -->
<rect x="0" y="0" width="1400" height="1.5" fill="#4F8EFF" opacity="0"
  style="animation: scan 2.1s linear 0.2s 1 forwards"/>

<!-- ░░ TITLE BLOCK ░░ -->
<g style="animation: fadeUp 0.8s ease 0.25s both">
  <text x="700" y="66"
    font-family="'Courier New',Consolas,monospace"
    font-size="78" font-weight="800" letter-spacing="24"
    fill="white" text-anchor="middle">ASD</text>
  <text x="700" y="96"
    font-family="'Courier New',Consolas,monospace"
    font-size="12.5" fill="#4F8EFF" letter-spacing="4.5"
    text-anchor="middle">SYSTEM ARCHITECT  ·  AI BUILDER  ·  FULL-STACK ENGINEER</text>
</g>

<!-- separator -->
<line x1="55" y1="112" x2="1345" y2="112"
  stroke="url(#rgb)" stroke-width="1" stroke-opacity="0.55"
  style="animation: fadeUp 0.4s ease 0.6s both"/>

<!-- corner brackets -->
<path d="M36 36 L36 18 L54 18" fill="none" stroke="#4F8EFF" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1364 36 L1364 18 L1346 18" fill="none" stroke="#4F8EFF" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round"/>
<path d="M36 524 L36 542 L54 542" fill="none" stroke="#4F8EFF" stroke-opacity="0.22" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1364 524 L1364 542 L1346 542" fill="none" stroke="#4F8EFF" stroke-opacity="0.22" stroke-width="1.8" stroke-linecap="round"/>

<!-- ░░ LEFT FEATURE PANEL ░░ -->
<g style="animation: fadeUp 0.7s ease 0.65s both">

  <!-- 1 -->
  <text x="52" y="163" font-family="system-ui" font-size="24" fill="#4F8EFF">⚡</text>
  <text x="86" y="160" font-family="'Courier New',monospace" font-size="14.5" fill="#E2E8F0" font-weight="700" letter-spacing="0.8">Long-Horizon Architecture</text>
  <text x="86" y="178" font-family="'Courier New',monospace" font-size="11.5" fill="#3D5870">Enterprise AI Systems Design</text>
  <line x1="52" y1="193" x2="330" y2="193" stroke="#192840" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- 2 -->
  <text x="52" y="228" font-family="system-ui" font-size="24" fill="#7C3AED">🏗️</text>
  <text x="86" y="225" font-family="'Courier New',monospace" font-size="14.5" fill="#E2E8F0" font-weight="700" letter-spacing="0.8">Frontier Full-Stack</text>
  <text x="86" y="243" font-family="'Courier New',monospace" font-size="11.5" fill="#3D5870">React · FastAPI · TypeScript</text>
  <line x1="52" y1="258" x2="330" y2="258" stroke="#192840" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- 3 -->
  <text x="52" y="293" font-family="system-ui" font-size="24" fill="#06B6D4">🧠</text>
  <text x="86" y="290" font-family="'Courier New',monospace" font-size="14.5" fill="#E2E8F0" font-weight="700" letter-spacing="0.8">Algorithm Engineering</text>
  <text x="86" y="308" font-family="'Courier New',monospace" font-size="11.5" fill="#3D5870">Deep Learning · LLMs · AI/ML</text>
  <line x1="52" y1="323" x2="330" y2="323" stroke="#192840" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- 4 -->
  <text x="52" y="358" font-family="system-ui" font-size="24" fill="#10B981">🌐</text>
  <text x="86" y="355" font-family="'Courier New',monospace" font-size="14.5" fill="#E2E8F0" font-weight="700" letter-spacing="0.8">Multi-Product Builder</text>
  <text x="86" y="373" font-family="'Courier New',monospace" font-size="11.5" fill="#3D5870">HyperPi-Ai Ecosystem · Linux</text>

  <!-- philosophy tagline -->
  <text x="52" y="420" font-family="Georgia,'Times New Roman',serif"
    font-size="12" fill="#213450" font-style="italic">"Precision That Thinks —</text>
  <text x="52" y="436" font-family="Georgia,'Times New Roman',serif"
    font-size="12" fill="#213450" font-style="italic"> Systems engineered to outlast the hype."</text>
</g>

<!-- ░░ AMBIENT PENGUIN GLOW ░░ -->
<ellipse cx="655" cy="498" rx="140" ry="42" fill="url(#aura)"
  style="animation: ambPulse 3.5s ease-in-out infinite"/>

<!-- ░░ PENGUIN + CUP (bob together) ░░ -->
<g style="animation: bob 3.5s ease-in-out infinite">

  <!-- shadow -->
  <ellipse cx="655" cy="482" rx="95" ry="17" fill="#4F8EFF">
    <animate attributeName="rx" values="95;76;95" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.09;0.22" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ── COFFEE CUP ── (at left wing tip) -->
  <g>
    <!-- cup body -->
    <path d="M528,368 L558,368 L554,444 L532,444 Z" fill="url(#cupG)" stroke="#2A3F5C" stroke-width="1.2"/>
    <!-- cup taper highlight -->
    <path d="M530,368 L538,444" stroke="#3A5578" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round"/>
    <!-- lid -->
    <rect x="524" y="358" width="38" height="13" rx="6.5" fill="url(#lidG)" stroke="#4B5E78" stroke-width="1"/>
    <!-- logo on cup -->
    <circle cx="543" cy="405" r="16" fill="#4F1FBE" opacity="0.9" filter="url(#g4)"/>
    <text x="543" y="411" text-anchor="middle" font-family="'Courier New',monospace"
      font-size="14" fill="white" font-weight="800">π</text>
    <!-- cup rim highlight -->
    <ellipse cx="543" cy="368" rx="19" ry="4.5" fill="#4B5E78" opacity="0.6"/>
